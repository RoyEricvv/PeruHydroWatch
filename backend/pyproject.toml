[project]
name = "peru-hydrowatch-backend"
version = "0.1.0"
description = "API, ingesta y análisis espacial de Perú HydroWatch 3D"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "rasterio>=1.4", "xarray>=2024.10", "shapely>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
